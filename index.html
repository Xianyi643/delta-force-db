<style>

    --code-bg:#f7f8fa;

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;

  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* 头部 */
  header{padding:40px 0 8px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:1px;color:var(--primary);
    background:var(--primary-soft);padding:4px 10px;border-radius:20px;font-weight:600;
  }
  h1{font-size:28px;margin:12px 0 4px;font-weight:700}
  .subtitle{color:var(--sub);font-size:14px}
  .howto{
    margin-top:14px;font-size:13px;color:var(--sub);
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  }
  .howto b{color:var(--text)}

  /* 搜索 + 筛选 */
  .toolbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 0;margin-top:8px}
  .search{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--border);border-radius:12px;padding:12px 16px;
    box-shadow:var(--shadow);transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--primary)}
  .search svg{flex:none;color:var(--sub)}
  .search input{
    flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--text);
  }
  .search .count{flex:none;font-size:12px;color:var(--sub)}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    border:1px solid var(--border);background:var(--card);color:var(--sub);
    padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;
    transition:all .15s;user-select:none;white-space:nowrap;
  }
  .chip:hover{border-color:var(--primary);color:var(--primary)}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

  .list{display:grid;grid-template-columns:1fr;gap:14px;padding:8px 0 40px}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;

  }
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(20,24,35,.1)}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{
    font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;letter-spacing:.5px;
    color:#fff;

  .tag.rifle{background:#e8862c}
  .tag.smg{background:#3b82f6}
  .tag.sniper{background:#8b5cf6}
  .tag.lmg{background:#10b981}
  .tag.pistol{background:#14b8a6}
  .tag.shotgun{background:#ef4444}
  .price{margin-left:auto;font-size:13px;color:var(--primary);font-weight:600}
  .price.empty{color:#c0c4cc;font-weight:400}
  h2.name{font-size:18px;font-weight:700;line-height:1.3}
  h2.name .title{font-weight:500;color:var(--sub);font-size:14px;margin-left:8px}
  .desc{font-size:13.5px;color:#454c59}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags span{font-size:12px;color:#5b6472;background:#f2f4f7;border-radius:6px;padding:2px 8px}
  .code-row{display:flex;align-items:center;gap:8px;margin-top:auto}
  .code{
    flex:1;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;color:#8a3c00;background:var(--code-bg);border:1px dashed #e5d5c4;
    border-radius:8px;padding:9px 12px;word-break:break-all;letter-spacing:.2px;
  }
  .copy{
    flex:none;border:1px solid var(--primary);background:var(--primary);color:#fff;
    padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;
    transition:opacity .15s;white-space:nowrap;
  }
  .copy:hover{opacity:.88}
  .copy.copied{background:#16a34a;border-color:#16a34a}

  .empty{text-align:center;color:var(--sub);padding:60px 0;font-size:14px}

  footer a{color:var(--primary);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#1f2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;

  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

const CATS = [
  {key:"all", label:"全部"},
  {key:"rifle", label:"突击步枪"},
  {key:"smg", label:"冲锋枪"},
  {key:"sniper", label:"狙击/射手"},
  {key:"lmg", label:"轻机枪"},
  {key:"pistol", label:"手枪"},
  {key:"shotgun", label:"霰弹枪"},
];

let state = { q:"", cat:"all" };
const $ = s => document.querySelector(s);
const list = $("#list"), count = $("#count"), toast = $("#toast");

function renderCats(){
  $("#cats").innerHTML = CATS.map(c =>
    `<button class="chip ${state.cat===c.key?'active':''}" data-cat="${c.key}">${c.label}</button>`
  ).join("");
}
function match(item){
  if(state.cat!=='all' && item.cat!==state.cat) return false;
  if(!state.q) return true;
  const hay = [item.name,item.type,item.code,item.title,item.desc,...item.tags].join(" ").toLowerCase();
  return state.q.split(/\s+/).every(k => hay.includes(k));
}
function render(){
  const items = DATA.filter(match);
  count.textContent = `共 ${items.length} 条`;
  if(!items.length){
    list.innerHTML = `<div class="empty">没有找到匹配的改枪码，换个关键词试试吧</div>`;
    return;
  }
  list.innerHTML = items.map((it,i)=>`
    <div class="card">
      <div class="card-top">
        <span class="tag ${it.cat}">${it.type}</span>
        <span class="price ${it.price?'':'empty'}">${it.price || '价格未标注'}</span>
      </div>
      <h2 class="name">${it.name}<span class="title">${it.title}</span></h2>
      <p class="desc">${it.desc}</p>
      ${it.tags.length?`<div class="tags">${it.tags.map(t=>`<span>${t}</span>`).join("")}</div>`:''}
      <div class="code-row">
        <div class="code">${it.code}</div>
        <button class="copy" data-i="${i}">复制</button>
      </div>
    </div>
  `).join("");
}

function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((res,rej)=>{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}
function showToast(msg){
  toast.textContent=msg; toast.classList.add("show");
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>toast.classList.remove("show"),1500);
}

$("#q").addEventListener("input", e=>{ state.q=e.target.value.trim().toLowerCase(); render(); });
$("#cats").addEventListener("click", e=>{
  const btn=e.target.closest(".chip"); if(!btn) return;
  state.cat=btn.dataset.cat; renderCats(); render();
});
list.addEventListener("click", e=>{
  const btn=e.target.closest(".copy"); if(!btn) return;
  const idx=+btn.dataset.i;
  // 重新定位到当前渲染结果中对应的条目
  const items=DATA.filter(match);
  const item=items[idx];
  if(!item) return;
  copy(item.code).then(()=>{
    btn.textContent="已复制"; btn.classList.add("copied");
    showToast(`已复制 ${item.name} 改枪码`);
    setTimeout(()=>{ btn.textContent="复制"; btn.classList.remove("copied"); },1500);
  }).catch(()=>showToast("复制失败，请手动长按复制"));
});

renderCats();
render();
